# Render Blueprint: deploys the web app from the repo root (it reads ../sample/).
services:
  - type: web
    name: blind-occupation-reader
    runtime: python
    plan: free
    buildCommand: pip install -r webapp/requirements.txt
    # One worker on purpose: the rate limits and daily cap live in memory.
    startCommand: gunicorn --chdir webapp --workers 1 --threads 4 app:app
    healthCheckPath: /api/limits
    autoDeployTrigger: commit
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # Render asks for it when you create the service; never commit it
      - key: TRUST_PROXY_HOPS
        value: "1"           # one Render proxy sits in front of the app
